name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.1'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          ini-values: error_reporting=-1, display_errors=On, zend.assertions=1
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Tests
        run: composer test

      - name: Generator runs without notices or deprecations
        run: |
          dir="$RUNNER_TEMP/project" && cp -r tests/Fixtures/project "$dir" && : > stderr.txt
          for config in wordpress laravel symfony yii3; do
            php -d error_reporting=-1 -d display_errors=stderr bin/settings-codegen generate -q --working-dir="$dir" --config=$config.json 2>> stderr.txt
            php -d error_reporting=-1 -d display_errors=stderr bin/settings-codegen generate --check -q --working-dir="$dir" --config=$config.json 2>> stderr.txt
          done
          if [ -s stderr.txt ]; then cat stderr.txt; exit 1; fi

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: PHPStan
        run: composer phpstan

      - name: Validate composer.json
        run: composer validate --strict

  coverage:
    name: Coverage (PHP 8.3, pcov, 100% required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: Tests with coverage
        run: vendor/bin/phpunit --coverage-clover build/clover.xml --coverage-text

      - name: Require 100% lines, methods and classes
        run: php tools/coverage-check.php build/clover.xml 100
